name: Compliance CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [feature/legal-ai-compliance-2026]

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile compliance modules
        run: |
          python -m py_compile \
            qrfacile_app/security_middleware.py \
            qrfacile_app/audit_core.py \
            qrfacile_app/compliance_ui.py \
            qrfacile_app/legal_acceptance_ui.py \
            qrfacile_app/ai_review_ui.py \
            qrfacile_app/ai_registry_ui.py \
            qrfacile_app/wine_compliance_engine_ui.py \
            qrfacile_app/services/ai_registry_service.py \
            qrfacile_app/services/wine_compliance_engine.py \
            scripts/compliance_retention.py

      - name: Run compliance regression tests
        run: |
          pytest -q \
            tests/test_compliance_baseline.py \
            tests/test_legal_acceptance_baseline.py \
            tests/test_privacy_incident_baseline.py \
            tests/test_ai_system_registry.py \
            tests/test_ai_registry_ui.py \
            tests/test_wine_compliance_engine.py

      - name: Check SQL migrations are transactional
        run: |
          for migration in \
            sql/2026_legal_ai_compliance.sql \
            sql/2026_legal_acceptance_constraints.sql \
            sql/2026_privacy_requests.sql \
            sql/2026_ai_system_registry.sql
          do
            grep -q '^BEGIN;' "$migration"
            grep -q '^COMMIT;' "$migration"
          done
