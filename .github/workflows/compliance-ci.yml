name: Compliance CI

on:
  pull_request:
    branches: [staging, feature/legal-ai-compliance-2026]
  push:
    branches: [feature/legal-ai-compliance-2026]

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qrfacile_test_pr2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qrfacile_test_only # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qrfacile_test_pr2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      QRFACILE_TEST_DATABASE_URL: postgresql://postgres:qrfacile_test_only@127.0.0.1:5432/qrfacile_test_pr2 # pragma: allowlist secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pip-audit detect-secrets pglast

      - name: Check committed diff formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            git diff --check "${BASE_SHA}...HEAD"
          else
            git diff --check HEAD^..HEAD
          fi

      - name: Compile all Python modules
        run: |
          python -m compileall -q qrfacile_app app scripts tests main.py

      - name: Import application with Python warnings as errors
        run: |
          python -W error -c "from qrfacile_app.main import app; assert len(app.routes) >= 70"

      - name: Run static project security gate
        run: |
          python scripts/project_security_audit.py --fail-on critical

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip-audit

      - name: Scan tracked source for secrets
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook

      - name: Run complete regression suite
        run: |
          pytest -q

      - name: Check SQL migrations are transactional
        run: python scripts/check_sql_transactions.py

      - name: Parse staging safety SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          files = sorted(Path("sql").glob("2026_staging_safety_reconciliation_v1*.sql"))
          assert len(files) == 4, files
          for path in files:
              parse_sql(path.read_text(encoding="utf-8"))
              print(f"PARSE_OK {path}")
          PY
