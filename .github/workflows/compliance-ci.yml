name: Compliance CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [feature/legal-ai-compliance-2026]

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pip-audit detect-secrets

      - name: Compile all Python modules
        run: |
          python -m compileall -q qrfacile_app app scripts tests main.py

      - name: Import application with Python warnings as errors
        run: |
          python -W error -c "from qrfacile_app.main import app; assert len(app.routes) >= 70"

      - name: Run static project security gate
        run: |
          python scripts/project_security_audit.py --fail-on critical

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip-audit

      - name: Scan tracked source for secrets
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook

      - name: Run complete regression suite
        run: |
          pytest -q

      - name: Check SQL migrations are transactional
        run: |
          for migration in sql/*.sql
          do
            test "$(head -n 1 "$migration")" = "BEGIN;"
            test "$(tail -n 1 "$migration")" = "COMMIT;"
          done
