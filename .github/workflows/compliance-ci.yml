name: Compliance CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [feature/legal-ai-compliance-2026]

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile compliance modules
        run: |
          python -m py_compile \
            qrfacile_app/security_middleware.py \
            qrfacile_app/audit_core.py \
            qrfacile_app/compliance_ui.py \
            qrfacile_app/legal_acceptance_ui.py \
            qrfacile_app/ai_review_ui.py \
            scripts/compliance_retention.py

      - name: Run compliance regression tests
        run: pytest -q tests/test_compliance_baseline.py tests/test_legal_acceptance_baseline.py

      - name: Check SQL migrations are transactional
        run: |
          grep -q '^BEGIN;' sql/2026_legal_ai_compliance.sql
          grep -q '^COMMIT;' sql/2026_legal_ai_compliance.sql
          grep -q '^BEGIN;' sql/2026_legal_acceptance_constraints.sql
          grep -q '^COMMIT;' sql/2026_legal_acceptance_constraints.sql
