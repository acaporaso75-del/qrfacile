<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#050b12"/>
  <rect x="90" y="90" width="1220" height="720" rx="34" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="140" y="140" width="1120" height="620" rx="28" fill="#0f172a" fill-opacity="0.98"/>

  <text x="190" y="220" font-size="54" font-family="Arial" font-weight="900" fill="#e5e7eb">Export QR pronto tipografia</text>
  <text x="190" y="270" font-size="26" font-family="Arial" font-weight="700" fill="#94a3b8">PNG · JPG · SVG · PDF · ZIP</text>

  <rect x="190" y="320" width="520" height="64" rx="18" fill="#22c55e"/>
  <text x="220" y="362" font-size="22" font-family="Arial" font-weight="900" fill="#052e16">Scarica file stampa (preset)</text>

  <rect x="190" y="420" width="520" height="320" rx="22" fill="#0b1220" stroke="rgba(255,255,255,0.12)"/>
  <text x="220" y="472" font-size="22" font-family="Arial" font-weight="900" fill="#e5e7eb">Preset consigliati</text>
  <text x="220" y="520" font-size="18" font-family="Arial" font-weight="700" fill="#94a3b8">• 20 mm / 300 dpi</text>
  <text x="220" y="560" font-size="18" font-family="Arial" font-weight="700" fill="#94a3b8">• 25 mm / 300 dpi</text>
  <text x="220" y="600" font-size="18" font-family="Arial" font-weight="700" fill="#94a3b8">• 30 mm / 600 dpi</text>
  <text x="220" y="660" font-size="18" font-family="Arial" font-weight="700" fill="#94a3b8">Invio ZIP a tipografia/grafico</text>

  <rect x="760" y="420" width="450" height="450" rx="22" fill="#0b1220" stroke="rgba(255,255,255,0.12)"/>
  <rect x="820" y="480" width="330" height="330" rx="26" fill="#ffffff"/>
  <text x="900" y="860" font-size="16" font-family="Arial" font-weight="900" fill="#94a3b8">Preview QR</text>
